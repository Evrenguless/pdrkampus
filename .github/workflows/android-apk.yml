name: PDRkampus Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "index.html"
      - "assets/**"
      - "resources/**"
      - "android/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Paketleri kur
        run: npm ci

      - name: Web dosyalarını Android ile eşitle
        run: npm run android:sync

      - name: APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını yayımla
        uses: actions/upload-artifact@v4
        with:
          name: PDRkampus-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
